<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Cancer Output Atlas architecture</title>
  <desc id="desc">User goal goes to agent tools: parse_goal, retrieve a baked public-metadata graph, then ODS groups or abstain. Find does not re-ingest.</desc>
  <style>
    .bg { fill: #fafafa; }
    .box { fill: #fff; stroke: #2b2b2b; stroke-width: 1.4; }
    .box-accent { fill: #fff; stroke: #2b2b2b; stroke-width: 1.8; }
    .box-soft { fill: #f3f3f3; stroke: #6a6a6a; stroke-width: 1.2; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2b2b; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2b2b; }
    .sub { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
    .fine { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #777; }
    .arrow { stroke: #2b2b2b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="420"/>
  <text class="title" x="32" y="36">Cancer Output Atlas</text>
  <text class="fine" x="32" y="56">Public metadata only · baked graph · never invent IDs</text>

  <rect class="box" x="32" y="88" width="140" height="64" rx="8"/>
  <text class="label" x="102" y="116" text-anchor="middle">User goal</text>
  <text class="sub" x="102" y="136" text-anchor="middle">reuse question</text>

  <path class="arrow" d="M 172 120 H 214"/>

  <rect class="box-accent" x="216" y="80" width="176" height="80" rx="8"/>
  <text class="label" x="304" y="112" text-anchor="middle">Agent tools</text>
  <text class="sub" x="304" y="132" text-anchor="middle">parse · retrieve · refuse</text>

  <path class="arrow" d="M 392 120 H 434"/>

  <rect class="box-soft" x="436" y="80" width="200" height="80" rx="8"/>
  <text class="label" x="536" y="112" text-anchor="middle">Baked graph</text>
  <text class="sub" x="536" y="132" text-anchor="middle">link_graph.json</text>

  <path class="arrow" d="M 636 104 H 688"/>
  <path class="arrow" d="M 636 136 H 688"/>

  <rect class="box" x="690" y="64" width="198" height="64" rx="8"/>
  <text class="label" x="789" y="90" text-anchor="middle">ODS groups</text>
  <text class="sub" x="789" y="110" text-anchor="middle">data · software · tool · …</text>

  <rect class="box" x="690" y="148" width="198" height="56" rx="8"/>
  <text class="label" x="789" y="174" text-anchor="middle">Abstain</text>
  <text class="sub" x="789" y="192" text-anchor="middle">empty · no invented IDs</text>

  <text class="fine" x="688" y="92" text-anchor="end">hits</text>
  <text class="fine" x="688" y="154" text-anchor="end">none</text>

  <rect class="box-soft" x="32" y="248" width="856" height="140" rx="10"/>
  <text class="label" x="52" y="278">What runs where</text>
  <text class="sub" x="52" y="304">Live demo (Cloud Run / serve.py): GET /api/find → find_by_goal → parse_goal (Gemini slot-parse if a key is set, else lexical) → baked graph.</text>
  <text class="sub" x="52" y="326">Does not construct strands.Agent on each find. No live ingest. No omics download.</text>
  <text class="sub" x="52" y="354">Official Strands SDK: runtime.py (Agent, @tool) and agent_tools.py. CLI: python -m cancer_output_atlas agent.</text>
  <text class="sub" x="52" y="376">Model provider is pluggable: gemini | strands | none. Keys via environment, never committed.</text>
</svg>

